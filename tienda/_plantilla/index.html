<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>__AGENCIA_NOMBRE__ — Catálogo de vehículos</title>
<meta name="description" content="Vehículos disponibles en __AGENCIA_NOMBRE__. Mirá el stock actualizado y consultá por WhatsApp.">
<link rel="icon" type="image/png" href="../../logo.png">
<meta name="theme-color" content="#1B5E3F">

<meta property="og:type" content="website">
<meta property="og:title" content="__AGENCIA_NOMBRE__ — Catálogo de vehículos">
<meta property="og:description" content="Vehículos disponibles en __AGENCIA_NOMBRE__. Mirá el stock actualizado y consultá por WhatsApp.">
<meta property="og:image" content="__OG_IMAGE__">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="__AGENCIA_NOMBRE__ — Catálogo de vehículos">
<meta name="twitter:image" content="__OG_IMAGE__">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #C9A227;
    --green: #1B5E3F;
    --green-light: #2E7D32;
    --black: #0D0D0D;
    --gray-light: #F5F5F5;
    --white: #FFFFFF;
    --text-muted: #6B7280;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Inter', sans-serif;
    background: var(--gray-light);
    color: var(--black);
    line-height: 1.5;
  }
  a { text-decoration: none; color: inherit; }

  header {
    background: var(--black); color: var(--white);
    padding: 24px 20px; text-align: center;
  }
  header h1 { font-size: 24px; font-weight: 900; margin-bottom: 4px; }
  header p { font-size: 13px; color: #BBB; }

  main { max-width: 1100px; margin: 0 auto; padding: 28px 16px 60px; }

  .estado-carga, .estado-vacio {
    text-align: center; padding: 60px 20px; color: var(--text-muted);
    font-size: 15px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 18px;
  }

  .auto-card {
    background: var(--white); border-radius: 16px; overflow: hidden;
    border: 1px solid #EEE; display: flex; flex-direction: column;
    transition: transform .15s, box-shadow .15s;
  }
  .auto-card:hover { transform: translateY(-4px); box-shadow: 0 12px 24px rgba(0,0,0,.08); }
  .auto-foto-wrap {
    position: relative; width: 100%; height: 190px;
    background: #E5E5E5; overflow: hidden;
  }
  .auto-foto-track {
    display: flex; height: 100%;
    transition: transform .25s ease;
  }
  .auto-foto {
    width: 100%; height: 100%; flex-shrink: 0;
    object-fit: cover; display: block;
  }
  .auto-foto-nav {
    position: absolute; top: 50%; transform: translateY(-50%);
    width: 28px; height: 28px; border-radius: 50%; border: none;
    background: rgba(0,0,0,.45); color: var(--white);
    font-size: 16px; line-height: 1; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .auto-foto-nav:hover { background: rgba(0,0,0,.65); }
  .auto-foto-nav.prev { left: 8px; }
  .auto-foto-nav.next { right: 8px; }
  .auto-foto-dots {
    position: absolute; bottom: 8px; left: 0; right: 0;
    display: flex; justify-content: center; gap: 5px;
  }
  .auto-foto-dots .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: rgba(255,255,255,.6);
  }
  .auto-foto-dots .dot.activo { background: var(--white); }
  .auto-info { padding: 16px; flex-grow: 1; display: flex; flex-direction: column; }
  .auto-titulo { font-size: 17px; font-weight: 800; margin-bottom: 4px; }
  .auto-detalle {
    font-size: 13px; color: var(--text-muted); margin-bottom: 12px;
  }
  .auto-precio {
    font-size: 20px; font-weight: 900; color: var(--green);
    margin-bottom: 14px;
  }
  .auto-btn {
    margin-top: auto; display: flex; align-items: center; justify-content: center;
    gap: 8px; background: #25D366; color: var(--white);
    font-weight: 700; font-size: 14px; padding: 11px; border-radius: 10px;
  }

  footer {
    text-align: center; padding: 28px 20px; font-size: 12px;
    color: var(--text-muted);
  }
  footer a { color: var(--green); font-weight: 700; }

  @media (max-width: 480px) {
    header h1 { font-size: 20px; }
    .grid { grid-template-columns: 1fr 1fr; gap: 12px; }
    .auto-foto { height: 140px; }
    .auto-info { padding: 12px; }
    .auto-titulo { font-size: 14px; }
    .auto-precio { font-size: 16px; }
  }
</style>
</head>
<body>

<header>
  <h1>__AGENCIA_NOMBRE__</h1>
  <p>Catálogo online · actualizado en vivo</p>
</header>

<main>
  <div id="contenido" class="estado-carga">Cargando vehículos…</div>
</main>

<footer>
  Tienda online hecha con <a href="https://getaxiora.com" target="_blank">R21</a>
</footer>

<script>
  const APPS_SCRIPT_URL = '__APPS_SCRIPT_URL__';
  const WHATSAPP_AGENCIA = '__WHATSAPP_AGENCIA__';

  function formatoPrecio(n) {
    const num = Number(n) || 0;
    return '$ ' + num.toLocaleString('es-AR');
  }

  function linkWhatsapp(auto) {
    const texto = `Hola! Te consulto por el ${auto.marca} ${auto.modelo} (${auto.anio}) que vi en la tienda online.`;
    return `https://wa.me/${WHATSAPP_AGENCIA}?text=${encodeURIComponent(texto)}`;
  }

  function renderAutos(lista) {
    const cont = document.getElementById('contenido');
    if (!lista || lista.length === 0) {
      cont.className = 'estado-vacio';
      cont.textContent = 'No hay vehículos disponibles en este momento. Volvé a mirar pronto.';
      return;
    }

    const grid = document.createElement('div');
    grid.className = 'grid';

    lista.forEach(auto => {
      const card = document.createElement('div');
      card.className = 'auto-card';

      const km = auto.km ? `${Number(auto.km).toLocaleString('es-AR')} km` : '';
      const detalle = [km, auto.combustible, auto.transmision].filter(Boolean).join(' · ');
      const fotos = (auto.fotos && auto.fotos.length) ? auto.fotos : [''];

      const imgs = fotos.map(f =>
        `<img class="auto-foto" src="${f}" alt="${auto.marca} ${auto.modelo}" loading="lazy" onerror="this.style.opacity=0.2">`
      ).join('');

      const nav = fotos.length > 1 ? `
        <button class="auto-foto-nav prev" onclick="moverFoto(this, -1)" aria-label="Foto anterior">‹</button>
        <button class="auto-foto-nav next" onclick="moverFoto(this, 1)" aria-label="Foto siguiente">›</button>
        <div class="auto-foto-dots">${fotos.map((_, i) => `<span class="dot ${i === 0 ? 'activo' : ''}"></span>`).join('')}</div>
      ` : '';

      card.innerHTML = `
        <div class="auto-foto-wrap" data-idx="0">
          <div class="auto-foto-track">${imgs}</div>
          ${nav}
        </div>
        <div class="auto-info">
          <div class="auto-titulo">${auto.marca} ${auto.modelo} (${auto.anio})</div>
          <div class="auto-detalle">${detalle}</div>
          <div class="auto-precio">${formatoPrecio(auto.precio)}</div>
          <a class="auto-btn" href="${linkWhatsapp(auto)}" target="_blank">💬 Consultar por WhatsApp</a>
        </div>
      `;
      grid.appendChild(card);
    });

    cont.replaceWith(grid);
  }

  function moverFoto(btn, delta) {
    const wrap = btn.closest('.auto-foto-wrap');
    const track = wrap.querySelector('.auto-foto-track');
    const dots = wrap.querySelectorAll('.dot');
    const total = dots.length;
    let idx = parseInt(wrap.dataset.idx || '0', 10);
    idx = (idx + delta + total) % total;
    wrap.dataset.idx = idx;
    track.style.transform = `translateX(-${idx * 100}%)`;
    dots.forEach((d, i) => d.classList.toggle('activo', i === idx));
  }

  fetch(`${APPS_SCRIPT_URL}?action=catalogoPublico`)
    .then(res => res.json())
    .then(data => {
      if (!data || data.ok !== true) throw new Error('Respuesta inválida');
      renderAutos(data.data);
    })
    .catch(err => {
      console.error('No se pudo cargar el catálogo:', err);
      const cont = document.getElementById('contenido');
      cont.className = 'estado-vacio';
      cont.textContent = 'No se pudo cargar el catálogo en este momento. Probá de nuevo en unos minutos.';
    });
</script>

</body>
</html>
